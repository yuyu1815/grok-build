name: PR-Agent

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  pull-requests: write
  issues: write

jobs:
  pr-agent:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    environment: PRbot
    steps:
      - name: Run PR-Agent
        uses: docker://pragent/pr-agent:0.40.0-github_action@sha256:09c05ab658712c0874ef3fdebf44fa1e104143af506378aefd5e7c422dde11c1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_KEY: ${{ secrets.PR_AGENT_API_KEY }}
          OPENAI.API_BASE: ${{ secrets.PR_AGENT_API_BASE }}
          CONFIG.MODEL: ${{ secrets.PR_AGENT_MODEL || 'openai/gpt-4o' }}
          CONFIG.FALLBACK_MODELS: '[]'
          CONFIG.CUSTOM_MODEL_MAX_TOKENS: "240000"
          CONFIG.MAX_MODEL_TOKENS: "240000"
          CONFIG.RESPONSE_LANGUAGE: ja-JP
          CONFIG.RESTRICTED_MODE: 'true'
          CONFIG.REPO_CONTEXT_FILES: '[]'
          CONFIG.USE_WIKI_SETTINGS_FILE: 'false'
          CONFIG.USE_GLOBAL_SETTINGS_FILE: 'false'
          GITHUB_ACTION_CONFIG.AUTO_REVIEW: 'true'
          GITHUB_ACTION_CONFIG.AUTO_DESCRIBE: 'false'
          GITHUB_ACTION_CONFIG.AUTO_IMPROVE: 'false'
          GITHUB_ACTION_CONFIG.PR_ACTIONS: '["opened","reopened","ready_for_review"]'
